<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumo - Create</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0b1320;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* NAV */
    .navbar {
      background: #060a12;
    }

    /* HEADER */
    .create-header {
      text-align: center;
      padding: 60px 20px 20px;
    }

    .create-header h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }

    .create-header p {
      opacity: 0.8;
    }

    /* INPUT AREA */
    .create-box {
      background: #111a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 20px;
    }

    .form-control {
      background: #0b1320;
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
    }

    .form-control::placeholder {
      color: rgba(255,255,255,0.5);
    }

    /* BUTTON */
    .btn-lumo {
      background: #00d4ff;
      border: none;
      color: black;
      font-weight: bold;
    }

    .btn-lumo:hover {
      background: #00b5d8;
    }

    /* POSTS */
    .post {
      background: #111a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
      transition: 0.3s;
    }

    .post:hover {
      transform: translateY(-4px);
      border-color: #00d4ff;
    }

    footer {
      background: #060a12;
      text-align: center;
      padding: 20px;
      margin-top: 60px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
  <a class="navbar-brand fw-bold" href="index.html">Lumo</a>

  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="nav">
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="explore.html">Explore</a>
      <a class="nav-link" href="create.html">Create</a>
    </div>
  </div>
</nav>


<!-- HEADER -->
<section class="create-header">

  <h1>Create</h1>

  <p>
    Share ideas, updates, or anything happening in your campus community.
  </p>

</section>


<!-- CREATE BOX -->
<div class="container">

  <div class="create-box">

    <input id="postInput" class="form-control mb-3" placeholder="What's happening on campus?" />

    <button class="btn btn-lumo w-100" onclick="createPost()">
      Post
    </button>

  </div>

  <!-- POSTS -->
  <div id="posts" class="mt-4"></div>

</div>


<!-- FOOTER -->
<footer>
  © 2026 Lumo — Create & Share Campus Moments
</footer>


<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
